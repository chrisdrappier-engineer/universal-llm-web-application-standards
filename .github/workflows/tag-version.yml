name: Tag version

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a semantic version: $version" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$version")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $version already points to $tagged_commit" >&2
              exit 1
            fi
            exit 0
          fi

          git tag "$version" "$GITHUB_SHA"
          git push origin "refs/tags/$version"
